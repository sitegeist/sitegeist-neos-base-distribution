'Vendor.WheelInventor:Content.AnchorNavigation':
  superTypes:
    'Neos.Neos:Content': true
    'Neos.Neos:ContentCollection': true
    'Vendor.Shared:Mixin.IDLess': true

  ui:
    label: 'Anchor Navigation'
    icon: 'sort-amount-asc'

  constraints:
    nodeTypes:
      '*': false
      'Vendor.WheelInventor:Content.Anchor': true

  properties:
    isSticky:
      type: boolean
      defaultValue: false
      ui:
        reloadIfChanged: true
        label: 'Sticky Navigation?'
        inspector:
          group: 'default'

  options:
    template:
      childNodes:
        anchor-1:
          type: 'Vendor.WheelInventor:Content.Anchor'
        anchor-2:
          type: 'Vendor.WheelInventor:Content.Anchor'
        anchor-3:
          type: 'Vendor.WheelInventor:Content.Anchor'
