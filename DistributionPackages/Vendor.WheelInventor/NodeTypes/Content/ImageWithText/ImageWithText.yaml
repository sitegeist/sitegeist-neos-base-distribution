'Vendor.WheelInventor:Content.ImageWithText':
  superTypes:
    'Vendor.WheelInventor:Content': true
    'Vendor.Shared:Mixin.Headline': true
    'Vendor.Shared:Mixin.Text': true
    'Vendor.Shared:Mixin.Link': true
    'Vendor.Shared:Mixin.Image': true

  ui:
    label: 'Bild mit Text'
    icon: 'id-card'
    inspector:
      groups:
        layout:
          label: 'Layout'
          icon: 'palette'
          position: 10

  properties:
    image:
      options:
        preset: 'image.free'
    link:
      validation: { }
    alignment:
      type: Vendor\Shared\Components\Block\ImageWithText\ImageWithTextAlignment
      defaultValue: 'Bild links'
      ui:
        label: 'Ausrichtung'
        reloadIfChanged: true
        inspector:
          group: 'layout'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
    layout:
      type: Vendor\Shared\Components\Block\ImageWithText\ImageWithTextLayout
      defaultValue: '50-50'
      ui:
        label: 'Breite Varianten'
        reloadIfChanged: true
        inspector:
          group: 'layout'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor

  postprocessors:
    alignmentOptions:
      postprocessor: Vendor\Shared\Application\EnumProvider
      postprocessorOptions:
        enumName: Vendor\Shared\Components\Block\ImageWithText\ImageWithTextAlignment
        propertyNames:
          - alignment
    layoutOptions:
      postprocessor: Vendor\Shared\Application\EnumProvider
      postprocessorOptions:
        enumName: Vendor\Shared\Components\Block\ImageWithText\ImageWithTextLayout
        propertyNames:
          - layout
