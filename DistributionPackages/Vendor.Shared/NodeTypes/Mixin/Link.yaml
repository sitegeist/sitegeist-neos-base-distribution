'Vendor.Shared:Mixin.Link':
  abstract: true
  ui:
    inspector:
      groups:
        link:
          label: 'Link'
          icon: 'link'
  properties:
    link:
      type: Neos\Neos\Domain\Link\Link
      ui:
        label: 'Link-Ziel'
        reloadIfChanged: true
        inspector:
          group: 'link'
          editorOptions:
            title: true
      validation:
        Neos.Neos/Validation/NotEmptyValidator: { }
    link__label:
      options:
        preset: 'rte.text'
      ui:
        inline:
          editorOptions:
            placeholder: 'Bitte Label eingeben'
