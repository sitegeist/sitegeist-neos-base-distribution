'Vendor.Shared:Mixin.Footer':
  abstract: true

  ui:
    icon: icon-globe
    label: 'Startseite'
    inspector:
      groups:
        footerLinks:
          tab: footer
          label: 'Verlinkungen'
          icon: 'link'

  properties:
    primaryMenuTitle:
      type: string
      options:
        preset: 'rte.plain'
      ui:
        label: 'Titel Footer-Navigation - Teil 1'
        inspector:
          group: 'footerLinks'

    secondaryMenuTitle:
      type: string
      options:
        preset: 'rte.plain'
      ui:
        label: 'Titel Footer-Navigation - Teil 2'
        inspector:
          group: 'footerLinks'

    thirdMenuTitle:
      type: string
      options:
        preset: 'rte.plain'
      ui:
        label: 'Titel Footer-Navigation - Teil 3'
        inspector:
          group: 'footerLinks'

  references:
    primaryMenu:
      scope: nodeAggregate
      constraints:
        nodeTypes:
          '*': false
          'Neos.Neos:Document': true
      ui:
        label: 'Footer-Navigation - Teil 1'
        reloadIfChanged: true
        inspector:
          group: 'footerLinks'
          editorOptions:
            nodeTypes: ['Neos.Neos:Document']
    secondaryMenu:
      scope: nodeAggregate
      constraints:
        nodeTypes:
          '*': false
          'Neos.Neos:Document': true
      ui:
        label: 'Footer-Navigation - Teil 2'
        reloadIfChanged: true
        inspector:
          group: 'footerLinks'
          editorOptions:
            nodeTypes: ['Neos.Neos:Document']
    thirdMenu:
      scope: nodeAggregate
      constraints:
        nodeTypes:
          '*': false
          'Neos.Neos:Document': true
      ui:
        label: 'Footer-Navigation - Teil 3'
        reloadIfChanged: true
        inspector:
          group: 'footerLinks'
          editorOptions:
            nodeTypes: ['Neos.Neos:Document']
