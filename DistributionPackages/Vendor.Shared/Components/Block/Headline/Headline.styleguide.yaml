title: "Headline"
description: "Typographic headline component"
group: UI
container:
  __type: "Vendor.Shared/Layout/AtomContainer/AtomContainer.cpx"
props: &defaultProps
  content: "Lorem ipsum dolor"
  variant: "regular"
  size: "large"
  tag: "h2"
useCases:
  hero:
    title: "Hero headline"
    props:
      <<: *defaultProps
      content: "Lorem ipsum dolor sit amet"
      size: "xLarge"
      tag: "h1"
  uppercase:
    title: "Uppercase label"
    props:
      <<: *defaultProps
      content: "Lorem ipsum"
      variant: "uppercase"
      size: "small"
      tag: "div"
