Sitegeist:
  Monocle:
    hiddenPrototypeNamePatterns:
      - 'Sitegeist.Kaleidoscope:*'

    styleguides:
      'CpxPackage::Vendor.Shared':
        ui:
          # mirrors the PageGrid component: 4 columns, 8 from md and 12 from xl,
          # the outer columns (gutter) are as wide as the gaps between the columns
          grids:
            xs:
              mediaQuery: '(max-width:767px)'
              label: 'Mobile (4)'
              columns: 4
              gap: 24px
              gutter: 0 24px
              maxWidth: 792px

            md:
              mediaQuery: '(min-width:768px) and (max-width:1023px)'
              label: 'Tablet (8)'
              columns: 8
              gap: 32px
              gutter: 0 32px
              maxWidth: 1280px

            lg:
              mediaQuery: '(min-width:1024px) and (max-width:1279px)'
              label: 'Small Desktop (8)'
              columns: 8
              gap: 56px
              gutter: 0 56px
              maxWidth: 1496px

            xl:
              mediaQuery: '(min-width:1280px)'
              label: 'Desktop (12)'
              columns: 12
              gap: 64px
              gutter: 0 64px
              maxWidth: 1920px

          viewportPresets:
            md: ~
            xs:
              label: 'Xtra Small'
              width: 320
              height: 768
            s:
              label: 'Small'
              width: 768
              height: 768
            m:
              label: 'Medium'
              width: 1024
              height: 768
            l:
              label: 'Large'
              width: 1280
              height: 768
            xl:
              label: 'Xtra Large'
              width: 1920
              height: 768

          structure:
            layout:
              position: 3
              match: Layout
              label: Layout
              icon: border-all
              color: '#35c3f8'
            ui:
              position: 2
              match: UI
              label: UI
              icon: atom
              color: '#84FAF0'
            block:
              position: 1
              match: Block
              label: Block
              icon: vector-square
              color: '#24F2AD'

        preview:
          styles:
            - 'resource://Vendor.Shared/Public/Build/Styles/main.min.css'
          scripts:
            - 'resource://Vendor.Shared/Public/Build/JavaScript/main.min.js'
